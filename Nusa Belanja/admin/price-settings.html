<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengaturan Harga — Nusa Belanja Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body data-title="Pengaturan Harga" data-sub="Ubah harga produk yang tampil di katalog" data-access="price-settings">
<div class="admin-shell" id="shell"></div>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script>
function onAdminReady(user) {
  const { esc, actor, addLog, overrides, setOverrides, toast } = Admin;
  const page = document.getElementById('page');
  let flashId = null;

  function render() {
    page.innerHTML = `
      <div class="page-stack">
        <div class="alert-box info"><span class="alert-icon">ℹ</span>
          <div><strong>Perubahan harga langsung berlaku di katalog</strong>Tidak ada batas harga minimum dan tidak ada persetujuan kedua.</div>
        </div>
        <div class="card">
          <div class="card-header">
            <h3>Harga Produk</h3>
            <button class="btn btn-ghost btn-sm" id="reset-all">Kembalikan harga normal</button>
          </div>
          <div class="table-wrap"><table>
            <thead><tr><th>Produk</th><th>Kategori</th><th>Harga normal</th><th>Harga aktif</th><th>Harga baru</th><th></th></tr></thead>
            <tbody>
              ${PRODUCTS.map(p => `
                <tr class="${flashId === p.id ? 'price-changed' : ''}">
                  <td>${p.emoji} ${esc(p.name)}</td>
                  <td class="muted">${catLabel(p.cat)}</td>
                  <td>${fmt(p.base)}</td>
                  <td><strong>${fmt(p.price)}</strong></td>
                  <td><input class="price-input" type="number" min="1" step="100" id="in-${p.id}" value="${p.price}"></td>
                  <td><button class="btn btn-primary btn-xs" data-save="${p.id}">Simpan</button></td>
                </tr>`).join('')}
            </tbody>
          </table></div>
        </div>
      </div>`;
    flashId = null;
    page.querySelectorAll('[data-save]').forEach(b => b.onclick = () => save(Number(b.dataset.save)));
    document.getElementById('reset-all').onclick = resetAll;
  }

  function save(id) {
    const p = PRODUCTS.find(x => x.id === id);
    const val = parseInt(document.getElementById('in-' + id).value, 10);
    if (!val || val < 1) { toast('Harga harus berupa angka lebih dari 0.', 'error'); return; }
    if (val === p.price) { toast('Harga tidak berubah.', ''); return; }

    const old = p.price;
    const ov = overrides();
    if (val === p.base) delete ov[id]; else ov[id] = val;
    setOverrides(ov);
    p.price = val;

    addLog({ ...actor(user), action: 'Ubah harga', target: `${p.name}: ${fmt(old)} → ${fmt(val)}`, type: 'price', level: val < p.base * 0.5 ? 'danger' : 'warn' });
    flashId = id;
    render();
    toast(`Harga ${p.name} diperbarui.`, 'success');
  }

  function resetAll() {
    const changed = PRODUCTS.filter(p => p.price !== p.base);
    if (!changed.length) { toast('Semua harga sudah normal.', ''); return; }
    PRODUCTS.forEach(p => { p.price = p.base; });
    setOverrides({});
    addLog({ ...actor(user), action: 'Reset harga', target: `${changed.length} produk dikembalikan ke harga normal`, type: 'price', level: 'info' });
    render();
    toast('Harga dikembalikan ke normal.', 'success');
  }

  render();
}
</script>
</body>
</html>
