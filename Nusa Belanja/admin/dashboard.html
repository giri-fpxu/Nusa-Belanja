<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dasbor — Nusa Belanja Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body data-title="Dasbor" data-sub="Ringkasan operasional dan peringatan sistem">
<div class="admin-shell" id="shell"></div>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script>
function onAdminReady(user) {
  const { esc, openAlerts, archived, read, accounts, hasMismatch, sensitiveKeys, actor, addLog, setArchived, renderLogItem, refreshAlertPill, overrides, toast } = Admin;
  const page = document.getElementById('page');

  function render() {
    const open = openAlerts();
    const arch = archived();
    const ov = overrides();
    const logs = read('nb_access_logs', []);
    const deep = PRODUCTS.filter(p => p.price < p.base * 0.5);
    const archivedAccs = accounts().filter(a => arch.includes(a.username) && hasMismatch(a));

    page.innerHTML = `
      ${deep.length ? `<div class="incident-bar"><span class="dot"></span>Harga ${deep.map(p => esc(p.name)).join(', ')} berada di bawah 50% harga normal. Periksa Log Akses.</div>` : ''}

      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Akun terdaftar</div><div class="stat-value">${accounts().length}</div><div class="stat-note">Akun admin internal</div></div>
        <div class="stat-card"><div class="stat-label">Produk aktif</div><div class="stat-value">${PRODUCTS.length}</div><div class="stat-note">Tampil di katalog</div></div>
        <div class="stat-card"><div class="stat-label">Harga diubah</div><div class="stat-value ${Object.keys(ov).length ? 'danger' : ''}">${Object.keys(ov).length}</div><div class="stat-note">Dari Pengaturan Harga</div></div>
        <div class="stat-card"><div class="stat-label">Peringatan terbuka</div><div class="stat-value ${open.length ? 'danger' : ''}">${open.length}</div><div class="stat-note">${arch.length ? arch.length + ' diarsipkan' : 'Belum ada yang diarsipkan'}</div></div>
        <div class="stat-card"><div class="stat-label">Aktivitas tercatat</div><div class="stat-value">${logs.length}</div><div class="stat-note">Log akses dan perubahan</div></div>
      </div>

      <div class="page-stack">
        <div class="card">
          <div class="card-header"><h3>Peringatan Sistem</h3></div>
          <div class="card-section">
            ${open.length ? `
              <div class="alert-box warning"><span class="alert-icon">⚠</span>
                <div><strong>Laporan harian: ${open.length} akun memiliki akses tidak sesuai jabatan</strong>
                  ${open.map(a => `${esc(a.name)} (${esc(a.username)}), ${esc(a.dept)}: ${sensitiveKeys(a).map(esc).join(', ')}`).join('<br>')}
                </div>
              </div>
              <div class="row-actions"><button class="btn btn-ghost btn-sm" id="archive-all">Arsipkan semua</button></div>
            ` : `<p class="empty">Tidak ada peringatan terbuka.</p>`}
            ${archivedAccs.length ? `<p class="muted" style="margin-top:14px">Diarsipkan: ${archivedAccs.map(a => esc(a.username)).join(', ')}. <button class="btn btn-ghost btn-xs" id="restore">Pulihkan</button></p>` : ''}
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>Aktivitas Terbaru</h3>${(user.access || []).includes('access-log') ? '<a class="muted" href="access-log.html" style="color:var(--brown-500)">Lihat semua →</a>' : ''}</div>
          <div class="card-section">
            ${logs.length ? `<div class="timeline">${logs.slice(0, 6).map(renderLogItem).join('')}</div>` : '<p class="empty">Belum ada aktivitas.</p>'}
          </div>
        </div>
      </div>`;

    refreshAlertPill();

    const archBtn = document.getElementById('archive-all');
    if (archBtn) archBtn.onclick = () => {
      const names = open.map(a => a.username);
      setArchived([...new Set([...arch, ...names])]);
      addLog({ ...actor(user), action: 'Arsipkan peringatan', target: names.join(', '), type: 'security', level: 'warn' });
      toast('Peringatan diarsipkan.', '');
      render();
    };
    const restoreBtn = document.getElementById('restore');
    if (restoreBtn) restoreBtn.onclick = () => {
      setArchived([]);
      addLog({ ...actor(user), action: 'Pulihkan peringatan', target: 'Daftar peringatan dipulihkan', type: 'security', level: 'info' });
      toast('Peringatan dipulihkan.', 'success');
      render();
    };
  }

  render();
}
</script>
</body>
</html>
