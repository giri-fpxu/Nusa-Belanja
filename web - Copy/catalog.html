<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog — Nusa Belanja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .catalog-layout { display: grid; grid-template-columns: 220px 1fr; gap: 32px; margin-top: 24px; }
    .sidebar-filter { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 20px; height: fit-content; position: sticky; top: 80px; }
    .sidebar-filter h4 { font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 10px; }
    .filter-group { margin-bottom: 20px; }
    .filter-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; }
    .filter-item input { accent-color: var(--brown-700); }
    .filter-item label { font-size: .85rem; cursor: pointer; color: var(--text-muted); }
    .filter-item label:hover { color: var(--brown-700); }
    .price-range { display: flex; flex-direction: column; gap: 8px; }
    .price-range input[type=range] { width: 100%; accent-color: var(--brown-700); }
    .price-range-labels { display: flex; justify-content: space-between; font-size: .75rem; color: var(--text-muted); }
    .sort-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .sort-bar p { font-size: .85rem; color: var(--text-muted); }
    .sort-bar select { padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--r); font-size: .85rem; background: var(--white); }
    .sort-bar select:focus { outline: none; border-color: var(--brown-500); }
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--text-muted); margin-bottom: 4px; }
    .breadcrumb a { color: var(--brown-500); }
    .breadcrumb a:hover { text-decoration: underline; }
    @media (max-width: 768px) { .catalog-layout { grid-template-columns: 1fr; } .sidebar-filter { position: static; } }
  </style>
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="container">
    <a href="index.html" class="navbar-brand">
      <div class="logo-icon">☕</div>
      <div>
        <span class="brand-name">Nusa Belanja</span>
        <span class="brand-sub">PT Nusa Belanja · Kopi Nusantara</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="index.html">Beranda</a>
      <a href="catalog.html" class="active">Katalog</a>
      <a href="index.html#fitur">Layanan</a>
      <a href="index.html#testimonial">Ulasan</a>
    </div>
    <div class="nav-actions">
      <a href="admin/login.html" class="btn btn-outline btn-sm">🔐 Admin</a>
      <button class="cart-btn" onclick="openCart()">
        🛒 Keranjang
        <span class="cart-badge" id="cart-badge">0</span>
      </button>
    </div>
  </div>
</nav>

<div class="container" style="padding-top:28px;padding-bottom:60px">
  <div class="breadcrumb">
    <a href="index.html">Beranda</a> / <span>Katalog</span>
  </div>
  <h2>Katalog Produk</h2>

  <div class="catalog-layout">
    <!-- ── Sidebar filter ────────────────────────────────────── -->
    <aside class="sidebar-filter">
      <div class="filter-group">
        <h4>Kategori</h4>
        <div class="filter-item"><input type="radio" name="cat" id="cat-all" value="all" checked><label for="cat-all">Semua</label></div>
        <div class="filter-item"><input type="radio" name="cat" id="cat-biji" value="biji-kopi"><label for="cat-biji">☕ Biji Kopi</label></div>
        <div class="filter-item"><input type="radio" name="cat" id="cat-paket" value="paket-kopi"><label for="cat-paket">📦 Paket Kopi</label></div>
        <div class="filter-item"><input type="radio" name="cat" id="cat-alat" value="alat-seduh"><label for="cat-alat">⚙️ Alat Seduh</label></div>
      </div>
      <div class="filter-group">
        <h4>Harga Maks</h4>
        <div class="price-range">
          <input type="range" id="price-slider" min="50000" max="450000" step="5000" value="450000" />
          <div class="price-range-labels">
            <span>Rp50.000</span>
            <span id="price-label">Rp450.000</span>
          </div>
        </div>
      </div>
      <div class="filter-group">
        <h4>Proses Kopi</h4>
        <div class="filter-item"><input type="checkbox" id="f-washed" value="washed" class="process-filter"><label for="f-washed">Washed</label></div>
        <div class="filter-item"><input type="checkbox" id="f-natural" value="natural" class="process-filter"><label for="f-natural">Natural</label></div>
        <div class="filter-item"><input type="checkbox" id="f-honey" value="honey" class="process-filter"><label for="f-honey">Honey</label></div>
      </div>
      <button class="btn btn-ghost" style="width:100%;font-size:.82rem" onclick="resetFilters()">↺ Reset Filter</button>
    </aside>

    <!-- ── Products ─────────────────────────────────────────── -->
    <div>
      <div class="sort-bar">
        <p id="result-count"></p>
        <select id="sort-select">
          <option value="default">Urutkan: Relevan</option>
          <option value="price-asc">Harga: Terendah</option>
          <option value="price-desc">Harga: Tertinggi</option>
          <option value="name-asc">Nama: A–Z</option>
        </select>
      </div>
      <div class="grid-4" id="product-grid"></div>
    </div>
  </div>
</div>

<!-- ── Cart Drawer ─────────────────────────────────────────────── -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="drawer-header">
    <h3>🛒 Keranjang Belanja</h3>
    <button class="drawer-close" onclick="closeCart()">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer">
    <div class="cart-total">
      <span class="cart-total-label">Total</span>
      <span class="cart-total-value" id="cart-total-val">Rp0</span>
    </div>
    <button class="btn btn-primary btn-full" onclick="showToast('Fitur checkout belum tersedia di demo ini.','')">Lanjut ke Pembayaran</button>
  </div>
</div>

<footer style="background:var(--brown-900);color:rgba(255,255,255,.5);text-align:center;padding:20px;font-size:.78rem">
  © 2026 PT Nusa Belanja (Fiktif — untuk keperluan produksi film)
</footer>

<div id="toast-container"></div>

<script src="js/data.js"></script>
<script>
  let maxPrice = 450000;
  let processFilters = [];

  function applyFilters() {
    const catVal = document.querySelector('input[name="cat"]:checked')?.value || 'all';
    const sortVal = document.getElementById('sort-select').value;

    let list = catVal === 'all' ? [...PRODUCTS] : PRODUCTS.filter(p => p.cat === catVal);
    list = list.filter(p => p.price <= maxPrice);
    if (processFilters.length > 0) {
      list = list.filter(p => processFilters.some(f => (p.tags || []).includes(f)));
    }

    if (sortVal === 'price-asc')  list.sort((a, b) => a.price - b.price);
    if (sortVal === 'price-desc') list.sort((a, b) => b.price - a.price);
    if (sortVal === 'name-asc')   list.sort((a, b) => a.name.localeCompare(b.name));

    renderProducts(list, 'product-grid');
    document.getElementById('result-count').textContent = `${list.length} produk ditemukan`;
  }

  function resetFilters() {
    document.getElementById('cat-all').checked = true;
    document.getElementById('price-slider').value = 450000;
    document.getElementById('price-label').textContent = 'Rp450.000';
    maxPrice = 450000;
    document.querySelectorAll('.process-filter').forEach(cb => cb.checked = false);
    processFilters = [];
    document.getElementById('sort-select').value = 'default';
    applyFilters();
  }

  document.querySelectorAll('input[name="cat"]').forEach(r => r.addEventListener('change', applyFilters));
  document.getElementById('sort-select').addEventListener('change', applyFilters);

  document.getElementById('price-slider').addEventListener('input', function () {
    maxPrice = parseInt(this.value);
    document.getElementById('price-label').textContent = 'Rp' + maxPrice.toLocaleString('id-ID');
    applyFilters();
  });

  document.querySelectorAll('.process-filter').forEach(cb => {
    cb.addEventListener('change', function () {
      processFilters = [...document.querySelectorAll('.process-filter:checked')].map(x => x.value);
      applyFilters();
    });
  });

  // URL param for category
  const urlCat = new URLSearchParams(location.search).get('cat');
  if (urlCat) {
    const radio = document.querySelector(`input[name="cat"][value="${urlCat}"]`);
    if (radio) radio.checked = true;
  }

  applyFilters();
</script>
</body>
</html>
