<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen Pengguna — Nusa Belanja Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body data-title="Manajemen Pengguna" data-sub="Akun internal dan hak aksesnya" data-access="user-management">
<div class="admin-shell" id="shell"></div>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script>
function onAdminReady(user) {
  const { esc, accounts, setAccounts, sensitiveKeys, hasMismatch, actor, addLog, refreshAlertPill, toast } = Admin;
  const isSensitive = k => k === 'finance-admin' || k === 'price-settings';
  const page = document.getElementById('page');

  function render() {
    const accs = accounts();
    const rows = accs.map(a => {
      const bad = hasMismatch(a);
      return `
        <tr>
          <td><strong>${esc(a.username)}</strong></td>
          <td>${esc(a.name)}<div class="muted">${esc(a.role)}</div></td>
          <td>${esc(a.dept)}</td>
          <td><div class="pill-list">${(a.access || []).map(k => `<span class="pill ${isSensitive(k) ? 'pill-amber' : 'pill-gray'}">${esc(k)}</span>`).join('')}</div></td>
          <td>${bad ? '<span class="pill pill-red">Tidak sesuai jabatan</span>' : '<span class="pill pill-green">Sesuai</span>'}</td>
          <td>${bad ? `<button class="btn btn-danger btn-xs" data-revoke="${esc(a.username)}">Cabut hak sensitif</button>` : ''}</td>
        </tr>`;
    }).join('');

    page.innerHTML = `
      <div class="page-stack">
        <div class="card">
          <div class="card-header"><h3>Daftar Akun</h3><span class="muted">${accs.length} akun</span></div>
          <div class="table-wrap"><table>
            <thead><tr><th>Username</th><th>Nama</th><th>Dept</th><th>Hak akses</th><th>Status</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>
          <div class="card-footer">
            <span class="muted">Hak sensitif <em>finance-admin</em> hanya untuk Finance; <em>price-settings</em> untuk Finance dan IT.</span>
          </div>
        </div>
      </div>`;

    page.querySelectorAll('[data-revoke]').forEach(b => b.onclick = () => revoke(b.dataset.revoke));
  }

  function revoke(username) {
    let removed = [];
    const next = accounts().map(a => {
      if (a.username !== username) return a;
      removed = sensitiveKeys(a);
      return { ...a, access: (a.access || []).filter(k => !removed.includes(k)) };
    });
    setAccounts(next);
    addLog({ ...actor(user), action: 'Cabut hak akses', target: `${username}: ${removed.join(', ')}`, type: 'security', level: 'info' });
    render();
    refreshAlertPill();
    toast(`Hak sensitif ${username} dicabut.`, 'success');
  }

  render();
}
</script>
</body>
</html>
