<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Akses — Nusa Belanja Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body data-title="Log Akses" data-sub="Riwayat login, perubahan, dan tindakan pada sistem" data-access="access-log">
<div class="admin-shell" id="shell"></div>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script>
function onAdminReady(user) {
  const { read, renderLogItem } = Admin;
  const page = document.getElementById('page');
  const TYPES = [
    ['all', 'Semua jenis'], ['auth', 'Autentikasi'], ['hr', 'HR'], ['security', 'Keamanan'],
    ['finance', 'Keuangan'], ['price', 'Harga'], ['data', 'Data'], ['system', 'Sistem'],
  ];
  let filter = 'all';

  function render() {
    const logs = read('nb_access_logs', []).filter(l => filter === 'all' || l.type === filter);
    page.innerHTML = `
      <div class="card">
        <div class="card-header">
          <h3>Riwayat Aktivitas</h3>
          <select class="filter-select" id="type">
            ${TYPES.map(([v, l]) => `<option value="${v}" ${v === filter ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="card-section">
          ${logs.length ? `<div class="timeline">${logs.map(renderLogItem).join('')}</div>` : '<p class="empty">Tidak ada catatan untuk filter ini.</p>'}
        </div>
      </div>`;
    document.getElementById('type').onchange = e => { filter = e.target.value; render(); };
  }

  render();
}
</script>
</body>
</html>
