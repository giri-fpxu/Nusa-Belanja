<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing — Nusa Belanja Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body data-title="Marketing" data-sub="Promo, laporan transaksi, dan email pelanggan" data-access="marketing-dashboard">
<div class="admin-shell" id="shell"></div>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script>
function onAdminReady(user) {
  const { esc, actor, addLog, toast } = Admin;
  const page = document.getElementById('page');

  // Data pelanggan fiktif untuk simulasi ekspor
  const CUSTOMERS = [
    { nama: 'Pelanggan Fiktif 01', hp: '0800-0000-0001', alamat: 'Jl. Contoh No. 1, Kota A', total: 1240000, riwayat: 'Gayo Arabika x3; V60 Set x1' },
    { nama: 'Pelanggan Fiktif 02', hp: '0800-0000-0002', alamat: 'Jl. Contoh No. 2, Kota B', total: 830000,  riwayat: 'Toraja Kalosi x2' },
    { nama: 'Pelanggan Fiktif 03', hp: '0800-0000-0003', alamat: 'Jl. Contoh No. 3, Kota C', total: 2105000, riwayat: 'Paket Gift Box x1; AeroPress x1' },
    { nama: 'Pelanggan Fiktif 04', hp: '0800-0000-0004', alamat: 'Jl. Contoh No. 4, Kota D', total: 415000,  riwayat: 'French Press x1' },
    { nama: 'Pelanggan Fiktif 05', hp: '0800-0000-0005', alamat: 'Jl. Contoh No. 5, Kota E', total: 960000,  riwayat: 'Langganan Bulanan Espresso x2' },
  ];

  const promo = PRODUCTS.find(p => p.id === 9); // Paket Kopi Premium
  const promoPrice = Math.round(promo.base * 0.9);

  page.innerHTML = `
    <div class="page-stack">
      <div class="card">
        <div class="card-header"><h3>Promo Gajian</h3><span class="pill pill-amber">GAJIAN10</span></div>
        <div class="card-section">
          <div class="stat-grid compact">
            <div class="stat-card"><div class="stat-label">Produk</div><div class="stat-value" style="font-size:1.1rem">${esc(promo.name)}</div></div>
            <div class="stat-card"><div class="stat-label">Harga normal</div><div class="stat-value" style="font-size:1.4rem">${fmt(promo.base)}</div></div>
            <div class="stat-card"><div class="stat-label">Harga promo (−10%)</div><div class="stat-value success" style="font-size:1.4rem">${fmt(promoPrice)}</div></div>
            <div class="stat-card"><div class="stat-label">Harga di katalog</div><div class="stat-value ${promo.price !== promoPrice ? 'danger' : ''}" style="font-size:1.4rem">${fmt(promo.price)}</div><div class="stat-note">${promo.price !== promoPrice ? 'Tidak sama dengan harga promo' : 'Sesuai harga promo'}</div></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>Ekspor Data Transaksi</h3></div>
        <div class="card-section">
          <p class="muted-block">Laporan Transaksi Lengkap memuat nama, nomor HP, alamat, dan riwayat belanja pelanggan.</p>
          <button class="btn btn-ghost btn-sm" id="export">Unduh Laporan Transaksi Lengkap (CSV)</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>Email Blast</h3></div>
        <div class="card-section">
          <div class="form-grid">
            <div class="form-group">
              <label for="mail-to">Penerima</label>
              <input id="mail-to" list="recipients" placeholder="alamat email" autocomplete="off" />
              <datalist id="recipients">
                <option value="agensi.lama@adlinkmedia.example"></option>
                <option value="pelanggan.loyal@nusabelanja.example"></option>
              </datalist>
            </div>
            <div class="form-group">
              <label for="mail-subj">Subjek</label>
              <input id="mail-subj" value="Promo Gajian: Paket Kopi Premium" />
            </div>
          </div>
          <div class="form-group">
            <label for="mail-body">Isi</label>
            <textarea id="mail-body" rows="3">Diskon 10% untuk Paket Kopi Premium. Gunakan kode GAJIAN10.</textarea>
          </div>
          <button class="btn btn-primary btn-sm" id="send">Kirim email blast</button>
        </div>
      </div>
    </div>`;

  document.getElementById('export').onclick = () => {
    const head = 'nama,nomor_hp,alamat,total_belanja,riwayat';
    const rows = CUSTOMERS.map(c => [c.nama, c.hp, c.alamat, c.total, c.riwayat]
      .map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    const blob = new Blob([[head, ...rows].join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'laporan_transaksi_lengkap.csv';
    a.click();
    addLog({ ...actor(user), action: 'Ekspor data transaksi', target: `Laporan Transaksi Lengkap (${rows.length} baris, memuat nomor HP dan alamat)`, type: 'data', level: 'warn' });
    toast('Laporan diunduh.', 'success');
  };

  document.getElementById('send').onclick = () => {
    const to = document.getElementById('mail-to').value.trim();
    const subj = document.getElementById('mail-subj').value.trim();
    if (!to) { toast('Isi alamat penerima terlebih dahulu.', 'error'); return; }
    addLog({ ...actor(user), action: 'Kirim email blast', target: `${to} · ${subj}`, type: 'data', level: 'warn' });
    toast('Email blast dikirim (simulasi).', 'success');
  };
}
</script>
</body>
</html>
